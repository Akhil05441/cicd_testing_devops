name: terraform

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Initialize Terraform
        id: init
        run: terraform init -reconfigure -backend-config="key=dev.tfstate"
      - run: terraform apply -auto-approve -var-file=envs/dev.tfvars
      - run: terraform destroy -auto-approve -var-file=envs/dev.tfvars
        if: always() && steps.init.outcome == 'success'
      

  staging:
    needs: dev
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Initialize Terraform
        id: init
        run: terraform init -reconfigure -backend-config="key=staging.tfstate"
      - run: terraform apply -auto-approve -var-file=envs/staging.tfvars
      - run: terraform destroy -auto-approve -var-file=envs/staging.tfvars
        if: always() && steps.init.outcome == 'success'

  prod:
    needs: staging
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Initialize Terraform
        id: init
        run: terraform init -reconfigure -backend-config="key=prod.tfstate"
      - run: terraform apply -auto-approve -var-file=envs/prod.tfvars
      - run: terraform destroy -auto-approve -var-file=envs/prod.tfvars
        if: always() && steps.init.outcome == 'success'